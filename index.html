<!DOCTYPE html>
<html lang="ja">
<head>
    <meta robot="noindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYUUSAI | Logical Design</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;800&family=Shippori+Mincho:wght@500&display=swap');

        :root {
            --bg-color: #F4F4F0; /* 少し温かみのある白（画用紙のような色） */
            --text-color: #111;
            --accent-color: #555;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Manrope', sans-serif;
            overflow-x: hidden;
        }

        /* ノイズテクスチャ（空気感を出す） */
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.4;
            pointer-events: none;
            z-index: 99;
            mix-blend-mode: overlay;
        }

        /* FV全体のレイアウト */
        .hero-container {
            height: 100vh;
            width: 100%;
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr; /* 4分割グリッド */
            border-bottom: 1px solid rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* 縦のグリッド線 */
        .grid-line {
            border-right: 1px solid rgba(0,0,0,0.08);
            height: 100%;
            position: relative;
        }

        /* メインコピー配置エリア */
        .hero-text-area {
            position: absolute;
            top: 50%;
            left: 5vw;
            transform: translateY(-50%);
            z-index: 10;
            pointer-events: none; /* クリックを透過 */
        }

        /* 巨大文字 */
        .big-title {
            font-size: 13vw; /* 画面幅に合わせて巨大化 */
            font-weight: 800;
            line-height: 0.85;
            letter-spacing: -0.04em;
            margin: 0;
            color: var(--text-color);
            overflow: hidden; /* アニメーション用マスク */
        }

        .title-line {
            display: block;
            transform: translateY(100%); /* 最初は隠しておく */
        }

        /* 繊細な日本語コピー */
        .sub-copy-wrapper {
            margin-top: 3rem;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .sub-copy {
            font-family: 'Shippori Mincho', serif;
            font-size: 1.2rem;
            letter-spacing: 0.15em;
            color: var(--accent-color);
            transform: translateY(100%);
        }

        /* 右側のビジュアル（抽象的な線画） */
        .hero-visual {
            position: absolute;
            right: -10vw;
            bottom: -10vh;
            width: 60vw;
            height: 60vw;
            z-index: 1;
            opacity: 0.6;
        }

        /* スクロールインジケーター */
        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 5vw;
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            z-index: 20;
        }
        
        .scroll-line {
            width: 0px; /* アニメーションで伸ばす */
            height: 1px;
            background: #000;
        }

    </style>
</head>
<body>

<div class="noise-overlay"></div>

<div class="hero-container">
    <div class="grid-line"></div>
    <div class="grid-line"></div>
    <div class="grid-line"></div>
    <div class="grid-line"></div>

    <div class="hero-text-area">
        <h1 class="big-title">
            <span class="title-line">DESIGN</span>
            <span class="title-line" style="margin-left: 0.5em; color: transparent; -webkit-text-stroke: 2px #111;">THE</span> <span class="title-line">STORY.</span>
        </h1>
        <div class="sub-copy-wrapper">
            <p class="sub-copy">論理と情緒を、設計する。</p>
        </div>
    </div>

    <svg class="hero-visual" viewBox="0 0 500 500">
        <circle cx="250" cy="250" r="200" fill="none" stroke="#ccc" stroke-width="1" />
        <circle cx="250" cy="250" r="100" fill="none" stroke="#111" stroke-width="0.5" class="rotate-circle" />
        <line x1="250" y1="50" x2="250" y2="450" stroke="#ccc" stroke-width="1" />
        <line x1="50" y1="250" x2="450" y2="250" stroke="#ccc" stroke-width="1" />
    </svg>

    <div class="scroll-indicator">
        <div class="scroll-line"></div>
        SCROLL
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    // 1. グリッド線が上から描かれる
    gsap.from(".grid-line", {
        height: 0,
        duration: 1.5,
        stagger: 0.1,
        ease: "power3.inOut"
    });

    // 2. 巨大文字が下からせり上がる（マスクアニメーション）
    gsap.to(".title-line", {
        y: 0,
        duration: 1.5,
        stagger: 0.15,
        delay: 0.5,
        ease: "power4.out"
    });

    // 3. 日本語コピーの登場
    gsap.to(".sub-copy", {
        y: 0,
        duration: 1,
        delay: 1.2,
        ease: "power2.out"
    });

    // 4. ビジュアルの回転
    gsap.to(".rotate-circle", {
        rotation: 360,
        transformOrigin: "center",
        duration: 20,
        repeat: -1,
        ease: "linear"
    });

    // 5. スクロールラインが伸びる
    gsap.to(".scroll-line", {
        width: "80px",
        duration: 1,
        delay: 1.5,
        ease: "power2.out"
    });
</script>
</body>
</html>
